<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ItLookedEasierOnline_Login</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
          <link rel="stylesheet" href="../css/header.css">
          <link rel="stylesheet" href="../css/footer.css">
          <link rel="stylesheet" href="../css/login.css">

</head>
<body>
    <div class="container_login">
        <div class="Login_box">

            <a id="Back_arrow" href="index_view.html">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div id="login-section">
                <h1 id="Login_text">Log in</h1>

                <form id="login-form" method="post">

                    <div>
                        <label for="email">E-mail</label>
                        <input 
                            type="email" 
                            id="email" 
                            placeholder="Emailaddress" 
                            name="email" 
                            autocomplete="email" 
                            required
                        >
                    </div>

                    <div>
                        <label for="password">Password</label>
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="Password" 
                            name="password" 
                            autocomplete="current-password" 
                            required
                        >
                    </div>

                    <button type="submit" id="login-submit">
                        Sign in
                    </button>

                    <button type="button" id="Register_button">
                        Don't have an account yet? Sign up now!
                    </button>
                </form>
            </div>


            <div id="register-section">
                <h1 id="Login_text">Register</h1>

                <form id="register-form" method="post">

                    <div>
                        <label for="username">Username</label>
                        <input 
                            type="text" 
                            id="username" 
                            placeholder="Username" 
                            name="username" 
                            autocomplete="username" 
                            required
                        >
                    </div>

                    <div>
                        <label for="register-email">E-mail</label>
                        <input 
                            type="email" 
                            id="register-email" 
                            placeholder="Emailaddress" 
                            name="email" 
                            required
                        >
                    </div>

                    <div>
                        <label for="register-password">Password</label>
                        <input 
                            type="password" 
                            id="register-password" 
                            placeholder="Password" 
                            name="password" 
                            required
                        >
                    </div>

                    <button type="submit" id="login-submit">
                        Create account
                    </button>

                    <button type="button" id="Back_to_login">
                        Already have an account? Log in
                    </button>

                </form>
            </div>

        </div>
    </div>

    <script src="../js/login_switch.js"></script>
</body>

</html>
