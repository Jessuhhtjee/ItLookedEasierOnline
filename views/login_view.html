<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ItLookedEasierOnline_Login</title>
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/index.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
          <link rel="stylesheet" href="../css/header.css">
          <link rel="stylesheet" href="../css/footer.css">
          <link rel="stylesheet" href="../css/login.css">

</head>
<body>
    <div class="container_login">
        <div class="Login_box">
            <a id="Back_arrow" href="index_view.html"><i class="fa-solid fa-arrow-left"></i></a>
            <h1 id="Login_text" >Log in</h1>
            <form id="login-form" method="post">
    <div>
        <label for="email">E-mail</label> <br>
        <input type="email" id="email" placeholder="Emailaddress" name="email" autocomplete="email" required>
    </div>

    <div>
        <label for="password">Password</label> <br>
        <input type="password" id="password" placeholder="Password" name="password" autocomplete="current-password" required>
    </div> 

    <button type="submit" id="login-submit">Sign in</button>
    <a href="" id="Register_button">Register</a>
        </form>
        </div>

    </div>
</body>
</html>
